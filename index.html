<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Porcini - Appennino Tosco-Emiliano</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { width: 100%; background: linear-gradient(135deg, #059669, #10b981); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        
        .coords-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.75rem; color: var(--text-muted); }
        .input-group input { background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 6px; font-size: 0.9rem; }
        
        .status-badge { text-align: center; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .score-val { font-size: 2.2rem; font-weight: 800; display: block; margin-top: 4px; }
        
        .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: var(--text-muted); }
        .metric-value { font-weight: 600; text-align: right; }
        
        .forest-card { background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--accent-green); padding: 12px; border-radius: 8px; margin-top: 8px; font-size: 0.85rem; line-height: 1.4; }
        .forest-card strong { color: var(--accent-green); display: block; margin-bottom: 2px; }

        .loading { text-align: center; color: var(--text-muted); padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍄 Radar Porcini Appennino</h1>
            <p>Analisi predittiva buttata (Toscano-Emiliano)</p>
        </header>

        <!-- Sezione Posizione -->
        <div class="card">
            <div class="card-title">Posizione e Quota</div>
            <button class="btn" onclick="fetchGPS()">📍 Rileva Posizione GPS</button>
            <div class="coords-grid">
                <div class="input-group">
                    <label>Latitudine</label>
                    <input type="text" id="lat" value="44.3500">
                </div>
                <div class="input-group">
                    <label>Longitudine</label>
                    <input type="text" id="lon" value="10.5160">
                </div>
            </div>
        </div>

        <!-- Risultato Analisi Buttata -->
        <div class="card">
            <div class="card-title">Indice di Buttata Appennino</div>
            <div id="statusBadge" class="status-badge" style="background: #334155; color: #94a3b8;">
                In attesa di analisi <span id="scoreVal" class="score_val">--%</span>
            </div>
            
            <div id="metricsList">
                <div class="loading">Premi il tasto GPS o avvia l'analisi per calcolare i parametri meteo del bosco...</div>
            </div>
        </div>

        <!-- Consigli Bosco -->
        <div class="card" id="adviceCard" style="display:none;">
            <div class="card-title">Profilo Bioclimatico Rilevato</div>
            <div class="forest-card" id="forestAdviceText"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            runAnalysis();
        };

        function fetchGPS() {
            if (!navigator.geolocation) {
                alert("La geolocalizzazione non è supportata dal tuo browser.");
                return;
            }
            const btn = document.querySelector('.btn');
            btn.innerText = "Rilevamento in corso...";
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('lat').value = position.coords.latitude.toFixed(4);
                document.getElementById('lon').value = position.coords.longitude.toFixed(4);
                btn.innerText = "📍 Rileva Posizione GPS";
                runAnalysis();
            }, error => {
                alert("Impossibile rilevare la posizione. Verifica i permessi GPS.");
                btn.innerText = "📍 Rileva Posizione GPS";
            }, { timeout: 10000, enableHighAccuracy: true });
        }

        async function runAnalysis() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            const metricsDiv = document.getElementById('metricsList');
            const badge = document.getElementById('statusBadge');
            const adviceCard = document.getElementById('adviceCard');
            const adviceText = document.getElementById('forestAdviceText');

            metricsDiv.innerHTML = '<div class="loading">Interrogazione modelli meteo appenninici (Open-Meteo)...</div>';

            // Richiediamo gli ultimi 14 giorni passati + previsioni future
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=14&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,windspeed_10m_max&timezone=auto`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                const elevation = data.elevation || 800; // Default media quota appenninica se non restituito
                const daily = data.daily;
                const times = daily.time;
                const precip = daily.precipitation_sum;
                const tmax = daily.temperature_2m_max;
                const tmin = daily.temperature_2m_min;
                const wind = daily.windspeed_10m_max;

                // Indice odierno è circa a metà array (dopo 14 giorni passati)
                const todayIndex = 14; 

                // Calcolo pioggia cumulata negli ultimi 10 giorni (da index 4 a 13)
                let rain10Days = 0;
                for (let i = todayIndex - 10; i < todayIndex; i++) {
                    if (precip[i]) rain10Days += precip[i];
                }

                // Temperatura media recente (ultimi 5 giorni)
                let tempSum = 0;
                let tempDaysCount = 0;
                for (let i = todayIndex - 5; i < todayIndex; i++) {
                    if (tmax[i] !== undefined && tmin[i] !== undefined) {
                        tempSum += (tmax[i] + tmin[i]) / 2;
                        tempDaysCount++;
                    }
                }
                const avgTemp = tempDaysCount > 0 ? (tempSum / tempDaysCount) : 15;

                // Vento massimo recente (ultimi 3 giorni)
                let maxWindRecent = 0;
                for (let i = todayIndex - 3; i <= todayIndex; i++) {
                    if (wind[i] && wind[i] > maxWindRecent) maxWindRecent = wind[i];
                }

                // Determinazione Fascia Altimetrica e Bosco
                let forestType = "";
                let idealTempMin = 14, idealTempMax = 20;
                if (elevation < 700) {
                    forestType = "Bassa Quota (300-700m) — Castagneti e Querceti. Specie: Boletus aereus (Nero) e Estatino.";
                    idealTempMin = 18; idealTempMax = 25;
                } else if (elevation >= 700 && elevation <= 1200) {
                    forestType = "Media Quota (700-1200m) — Faggete pure o miste con Castagno. Specie: Boletus edulis e Pinophilus.";
                    idealTempMin = 13; idealTempMax = 19;
                } else {
                    forestType = "Alta Quota (>1200m) — Faggete alte, Abetaie e Mirtilleti appenninici. Specie: Boletus edulis.";
                    idealTempMin = 9; idealTempMax = 15;
                }

                // Algoritmo di punteggio Buttata (0-100)
                // 1. Pioggia (Ottimale tra 30mm e 90mm negli ultimi 10 giorni)
                let rainScore = 0;
                if (rain10Days >= 25 && rain10Days <= 90) rainScore = 100;
                else if (rain10Days > 10 && rain10Days < 25) rainScore = 50;
                else if (rain10Days > 90 && rain10Days <= 130) rainScore = 70;
                else if (rain10Days > 130) rainScore = 40; // Troppa acqua / dilavamento
                else rainScore = 10; // Troppo secco

                // 2. Temperatura (Vicina al range ideale della fascia)
                let tempScore = 100;
                if (avgTemp < idealTempMin) {
                    tempScore = Math.max(0, 100 - (idealTempMin - avgTemp) * 15);
                } else if (avgTemp > idealTempMax) {
                    tempScore = Math.max(0, 100 - (avgTemp - idealTempMax) * 15);
                }

                // 3. Vento (Se vento forte recente > 30 km/h, penalizza forte per essiccazione suolo)
                let windPenalty = 0;
                if (maxWindRecent > 28) windPenalty = 25;
                else if (maxWindRecent > 20) windPenalty = 10;

                let finalScore = Math.round((rainScore * 0.6) + (tempScore * 0.4) - windPenalty);
                finalScore = Math.max(0, Math.min(100, finalScore));

                // Assegnazione Badge e Colore
                let badgeText = "";
                let badgeColor = "";
                if (finalScore < 25) {
                    badgeText = "Dormiente / Secco";
                    badgeColor = "var(--accent-red)";
                } else if (finalScore < 50) {
                    badgeText = "In Preparazione";
                    badgeColor = "var(--accent-yellow)";
                } else if (finalScore < 75) {
                    badgeText = "Condizioni Favorevoli";
                    badgeColor = "var(--accent-green)";
                } else {
                    badgeText = "🔥 Piena Buttata!";
                    badgeColor = "#059669";
                }

                badge.style.background = badgeColor;
                badge.style.color = "#ffffff";
                badge.innerHTML = `${badgeText} <span class="score-val">${finalScore}%</span>`;

                // Rendering metriche dettagliate
                metricsList.innerHTML = `
                    <div class="metric-row">
                        <span class="metric-label">Quota Rilevata:</span>
                        <span class="metric-value">${Math.round(elevation)} m s.l.m.</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Pioggia Ultimi 10 Giorni:</span>
                        <span class="metric-value">${rain10Days.toFixed(1)} mm</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Temp. Media Recente:</span>
                        <span class="metric-value">${avgTemp.toFixed(1)}°C (Ideale: ${idealTempMin}-${idealTempMax}°C)</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Vento Max Recente:</span>
                        <span class="metric-value">${maxWindRecent.toFixed(1)} km/h</span>
                    </div>
                `;

                adviceCard.style.display = "block";
                adviceText.innerHTML = `<strong>Fascia Ecologica:</strong> ${forestType}<br><br><em>Nota appenninica:</em> Con ${rain10Days.toFixed(1)}mm di pioggia e ${avgTemp.toFixed(1)}°C medi, il termometro biologico del bosco è ${finalScore >= 50 ? 'attivo. Cerca nelle zone di crinale o impluvi riparati dai venti di tramontana.' : 'ancora freddo o asciutto. In attesa del giusto shock termico/idrico.'}`;

            } catch (err) {
                console.error(err);
                metricsList.innerHTML = '<div class="loading" style="color:var(--accent-red);">Errore nel recupero dati meteo. Riprova tra poco.</div>';
            }
        }
    </script>
</body>
</html>
